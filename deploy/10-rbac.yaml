apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-task-runner
  namespace: agent-tasks
  labels:
    app.kubernetes.io/name: agent-task-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-task-runner
  namespace: agent-tasks
  labels:
    app.kubernetes.io/name: agent-task-runner
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-task-runner
  namespace: agent-tasks
  labels:
    app.kubernetes.io/name: agent-task-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-task-runner
subjects:
  - kind: ServiceAccount
    name: agent-task-runner
    namespace: agent-tasks
