apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace.yaml
  - 10-rbac.yaml
  - 30-configmap.yaml
  - 40-deployment.yaml
  - 50-service.yaml
  - 60-networkpolicy.yaml
  - 65-worker-networkpolicy.yaml
configMapGenerator:
  - name: agent-task-worker-home
    namespace: agent-tasks
    files:
      - worker-home/zai-web-mcp/provider.py
      - worker-home/zai-web-mcp/plugin.yaml
      - worker-home/zai-web-mcp/__init__.py
    options:
      disableNameSuffixHash: true
